name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Installa dipendenze
        run: |
          pip install pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed --name="RilevaPresenza" RILEVAPRESENZA_PC_UNIPD.py

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: RilevaPresenza-Windows-x64
          path: dist/RilevaPresenza.exe

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install pyinstaller

      - name: Build .app (ARM64)
        run: |
          pyinstaller --onefile --windowed --name="RilevaPresenza" RILEVAPRESENZA_PC_UNIPD.py

      - name: Zip del .app
        run: |
          cd dist
          zip -r RilevaPresenza-macOS-arm64.zip RilevaPresenza.app

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: RilevaPresenza-macOS-arm64
          path: dist/RilevaPresenza-macOS-arm64.zip

  build-macos-intel:
    runs-on: macos-13
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install pyinstaller

      - name: Build .app (Intel)
        run: |
          pyinstaller --onefile --windowed --name="RilevaPresenza" RILEVAPRESENZA_PC_UNIPD.py

      - name: Zip del .app
        run: |
          cd dist
          zip -r RilevaPresenza-macOS-intel.zip RilevaPresenza.app

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: RilevaPresenza-macOS-intel
          path: dist/RilevaPresenza-macOS-intel.zip

  release:
    needs: [build-windows, build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Scarica tutti gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crea Release su GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RilevaPresenza-Windows-x64/RilevaPresenza.exe
            artifacts/RilevaPresenza-macOS-arm64/RilevaPresenza-macOS-arm64.zip
            artifacts/RilevaPresenza-macOS-intel/RilevaPresenza-macOS-intel.zip